<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Verification Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b1020;
    color: white;
    font-family: Arial, sans-serif;
}

.header {
    padding: 20px;
    background: #11182d;
    border-bottom: 1px solid #29334d;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.header p {
    margin: 6px 0 0;
    color: #8993aa;
    font-size: 13px;
}

.container {
    max-width: 1300px;
    margin: auto;
    padding: 20px;
}

.login {
    max-width: 420px;
    margin: 70px auto;
    padding: 25px;
    background: #11182d;
    border: 1px solid #29334d;
    border-radius: 16px;
}

.login h2 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 12px;
    background: #080d19;
    color: white;
    border: 1px solid #303b59;
    border-radius: 10px;
    outline: none;
}

button {
    border: 0;
    padding: 12px 18px;
    border-radius: 10px;
    background: #4f7cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.test {
    background: #26324e;
    margin-left: 5px;
}

.error {
    margin-top: 12px;
    padding: 12px;
    background: #351b23;
    border-radius: 10px;
    color: #ff7c7c;
    display: none;
    white-space: pre-wrap;
    word-break: break-word;
}

.success-msg {
    margin-top: 12px;
    padding: 12px;
    background: #143425;
    border-radius: 10px;
    color: #58e49c;
    display: none;
}

.dashboard {
    display: none;
}

.topbar {
    margin-bottom: 20px;
    overflow: hidden;
}

.refresh {
    float: right;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: #11182d;
    border: 1px solid #29334d;
    border-radius: 15px;
    padding: 20px;
}

.card-title {
    color: #8993aa;
    font-size: 12px;
}

.card-number {
    font-size: 30px;
    font-weight: bold;
    margin-top: 8px;
}

.section {
    background: #11182d;
    border: 1px solid #29334d;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
}

.section h2 {
    margin-top: 0;
    font-size: 18px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
}

th,
td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #29334d;
    font-size: 13px;
}

th {
    color: #8993aa;
}

.badge {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 11px;
}

.success {
    color: #54e59b;
    background: #123c29;
}

.failed {
    color: #ff7373;
    background: #401c23;
}

.active {
    color: #ffd35b;
    background: #3b3115;
}

.debug {
    background: #080d19;
    padding: 15px;
    border-radius: 10px;
    color: #9ba6bd;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
}

@media(max-width:800px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media(max-width:450px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 12px;
    }

}

</style>

</head>


<body>


<div class="header">

    <h1>Verification Admin</h1>

    <p>Vercel Verification Dashboard</p>

</div>


<div id="loginBox" class="login">

    <h2>Admin Login</h2>

    <input
        type="password"
        id="password"
        placeholder="Admin password"
    >

    <button onclick="login()">
        Login
    </button>

    <button
        class="test"
        onclick="testAPI()"
    >
        Test API
    </button>

    <div id="loginError" class="error"></div>

    <div
        id="loginSuccess"
        class="success-msg"
    ></div>

</div>


<div id="dashboard" class="dashboard">

<div class="container">


    <div class="topbar">

        <button
            class="refresh"
            onclick="loadData()"
        >
            Refresh
        </button>

    </div>


    <div class="stats">

        <div class="card">

            <div class="card-title">
                TOTAL
            </div>

            <div
                id="total"
                class="card-number"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                SUCCESS
            </div>

            <div
                id="success"
                class="card-number"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                FAILED
            </div>

            <div
                id="failed"
                class="card-number"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                ACTIVE
            </div>

            <div
                id="active"
                class="card-number"
            >
                0
            </div>

        </div>

    </div>


    <div class="section">

        <h2>Bot Wise Statistics</h2>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>Bot Hash</th>
                        <th>Total</th>
                        <th>Success</th>
                        <th>Failed</th>
                        <th>Active</th>
                    </tr>

                </thead>

                <tbody id="botTable"></tbody>

            </table>

        </div>

    </div>


    <div class="section">

        <h2>All Verification Data</h2>

        <input
            id="search"
            placeholder="Search user, bot, IP, device..."
            oninput="filterRecords()"
        >

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>User ID</th>
                        <th>Bot</th>
                        <th>Status</th>
                        <th>IP</th>
                        <th>Platform</th>
                        <th>Device ID</th>
                        <th>Time</th>
                    </tr>

                </thead>

                <tbody id="recordTable"></tbody>

            </table>

        </div>

    </div>


    <div class="section">

        <h2>API Debug</h2>

        <div
            id="debug"
            class="debug"
        >
            Waiting...
        </div>

    </div>


</div>

</div>


<script>

let ADMIN_PASSWORD = "";

let allRecords = [];


function showError(message) {

    const box =
        document.getElementById("loginError");

    box.style.display = "block";

    box.innerText = message;

}


function showSuccess(message) {

    const box =
        document.getElementById("loginSuccess");

    box.style.display = "block";

    box.innerText = message;

}


function clearMessages() {

    document.getElementById("loginError")
        .style.display = "none";

    document.getElementById("loginSuccess")
        .style.display = "none";

}


function login() {

    clearMessages();

    const password =
        document
        .getElementById("password")
        .value
        .trim();


    if (!password) {

        showError(
            "Please enter admin password."
        );

        return;
    }


    ADMIN_PASSWORD = password;

    loadData();

}


async function testAPI() {

    clearMessages();

    const password =
        document
        .getElementById("password")
        .value
        .trim();


    try {

        const response =
            await fetch(
                "/api/admin",
                {
                    method: "GET",
                    cache: "no-store",
                    headers: {
                        "X-Admin-Password":
                            password
                    }
                }
            );


        const text =
            await response.text();


        document.getElementById("debug")
            .innerText =
            "HTTP " +
            response.status +
            "\n\n" +
            text;


        let data;


        try {

            data = JSON.parse(text);

        } catch (error) {

            showError(
                "API did not return JSON.\n\n" +
                "HTTP: " +
                response.status +
                "\n\n" +
                text.substring(0, 3000)
            );

            return;
        }


        if (!response.ok) {

            showError(
                JSON.stringify(
                    data,
                    null,
                    2
                )
            );

            return;
        }


        showSuccess(
            "Vercel Admin API is working."
        );


    } catch (error) {

        showError(
            "Request failed:\n\n" +
            error.message
        );

    }

}


async function loadData() {

    clearMessages();

    try {

        const response =
            await fetch(
                "/api/admin",
                {
                    method: "GET",
                    cache: "no-store",
                    headers: {
                        "X-Admin-Password":
                            ADMIN_PASSWORD
                    }
                }
            );


        const text =
            await response.text();


        let data;


        try {

            data = JSON.parse(text);

        } catch (error) {

            showError(
                "Invalid API response.\n\n" +
                "HTTP: " +
                response.status +
                "\n\n" +
                text.substring(0, 3000)
            );

            return;
        }


        document.getElementById("debug")
            .innerText =
            JSON.stringify(
                data,
                null,
                2
            );


        if (!response.ok) {

            showError(
                data.message ||
                data.error ||
                "API request failed."
            );

            return;
        }


        if (data.status !== "success") {

            showError(
                data.message ||
                "API returned failure."
            );

            return;
        }


        document.getElementById("loginBox")
            .style.display = "none";


        document.getElementById("dashboard")
            .style.display = "block";


        document.getElementById("total")
            .innerText =
            data.stats.total;


        document.getElementById("success")
            .innerText =
            data.stats.success;


        document.getElementById("failed")
            .innerText =
            data.stats.failed;


        document.getElementById("active")
            .innerText =
            data.stats.active;


        allRecords =
            data.records || [];


        renderBots(
            data.bots || []
        );


        renderRecords(
            allRecords
        );


    } catch (error) {

        showError(
            "Request failed.\n\n" +
            error.name +
            ": " +
            error.message
        );

    }

}


function renderBots(bots) {

    const table =
        document.getElementById("botTable");

    table.innerHTML = "";


    if (!bots.length) {

        table.innerHTML =
            "<tr><td colspan='5'>No bot data.</td></tr>";

        return;
    }


    bots.forEach(function(bot) {

        const row =
            document.createElement("tr");


        row.innerHTML =

            "<td>" +
            escapeHtml(bot.bot_hash) +
            "</td>" +

            "<td>" +
            bot.total +
            "</td>" +

            "<td>" +
            "<span class='badge success'>" +
            bot.success +
            "</span>" +
            "</td>" +

            "<td>" +
            "<span class='badge failed'>" +
            bot.failed +
            "</span>" +
            "</td>" +

            "<td>" +
            "<span class='badge active'>" +
            bot.active +
            "</span>" +
            "</td>";


        table.appendChild(row);

    });

}


function renderRecords(records) {

    const table =
        document.getElementById("recordTable");

    table.innerHTML = "";


    if (!records.length) {

        table.innerHTML =
            "<tr><td colspan='7'>No records.</td></tr>";

        return;
    }


    records.forEach(function(record) {

        const status =
            String(
                record.status || "unknown"
            ).toLowerCase();


        let badge = "active";


        if (status === "success") {
            badge = "success";
        }


        if (status === "failed") {
            badge = "failed";
        }


        const row =
            document.createElement("tr");


        row.innerHTML =

            "<td>" +
            escapeHtml(record.user_id || "-") +
            "</td>" +

            "<td>" +
            escapeHtml(record.bot_hash || "-") +
            "</td>" +

            "<td>" +
            "<span class='badge " +
            badge +
            "'>" +
            escapeHtml(status) +
            "</span>" +
            "</td>" +

            "<td>" +
            escapeHtml(record.ip || "-") +
            "</td>" +

            "<td>" +
            escapeHtml(record.platform || "-") +
            "</td>" +

            "<td>" +
            escapeHtml(record.device_id || "-") +
            "</td>" +

            "<td>" +
            escapeHtml(record.created_at || "-") +
            "</td>";


        table.appendChild(row);

    });

}


function filterRecords() {

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    if (!search) {

        renderRecords(allRecords);

        return;
    }


    const filtered =
        allRecords.filter(function(record) {

            return JSON.stringify(record)
                .toLowerCase()
                .includes(search);

        });


    renderRecords(filtered);

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

</script>

</body>

    </html>
