<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Secure Verification | Jenil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
    <script src="script.js"></script>
    
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
    </script>
    
</head>
<body>
    
                    
    <!-- SECURITY KEYBOARD PROTECTION -->
    <script>
        document.addEventListener("keydown", function(e) {

            if (
                e.key === "F12" ||
                (
                    e.ctrlKey &&
                    e.shiftKey &&
                    (
                        e.key === "I" ||
                        e.key === "J" ||
                        e.key === "C"
                    )
                ) ||
                (
                    e.ctrlKey &&
                    (
                        e.key === "U" ||
                        e.key === "S"
                    )
                )
            ) {
                e.preventDefault();
                return false;
            }

        });

        (function() {

            const threshold = 160;

            setInterval(function() {

                const widthDiff =
                    window.outerWidth - window.innerWidth;

                const heightDiff =
                    window.outerHeight - window.innerHeight;

                if (
                    widthDiff > threshold ||
                    heightDiff > threshold
                ) {
                    document.body.innerHTML = "";
                    window.location.href = "about:blank";
                }

            }, 1000);

        })();
    </script>


    <!-- LOUD UI SOUND SYSTEM -->
    <script>
        (() => {

            let ctx = null;

            function getCtx() {

                if (!ctx) {

                    const AudioContext =
                        window.AudioContext ||
                        window.webkitAudioContext;

                    if (!AudioContext) {
                        return null;
                    }

                    ctx = new AudioContext();
                }

                if (ctx.state === "suspended") {
                    ctx.resume();
                }

                return ctx;
            }


            function unlock() {
                getCtx();
            }


            document.addEventListener(
                "click",
                unlock,
                { once: true }
            );

            document.addEventListener(
                "touchstart",
                unlock,
                { once: true }
            );


            function blip(type) {

                const audioCtx = getCtx();

                if (!audioCtx) {
                    return;
                }

                const now =
                    audioCtx.currentTime;

                let freq = 520;
                let duration = 0.14;
                let gainValue = 0.22;
                let wave = "triangle";
                let glideTo = null;


                if (type === "hover") {

                    freq = 740;
                    duration = 0.08;
                    gainValue = 0.14;
                    wave = "sine";

                }


                if (type === "success") {

                    freq = 660;
                    duration = 0.28;
                    gainValue = 0.24;
                    wave = "sine";
                    glideTo = 990;

                }


                if (type === "error") {

                    freq = 220;
                    duration = 0.28;
                    gainValue = 0.22;
                    wave = "sawtooth";
                    glideTo = 140;

                }


                const osc =
                    audioCtx.createOscillator();

                const gain =
                    audioCtx.createGain();


                osc.type = wave;

                osc.frequency.setValueAtTime(
                    freq,
                    now
                );


                if (glideTo) {

                    osc.frequency
                        .exponentialRampToValueAtTime(
                            glideTo,
                            now + duration
                        );

                }


                gain.gain.setValueAtTime(
                    0,
                    now
                );


                gain.gain.linearRampToValueAtTime(
                    gainValue,
                    now + 0.012
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + duration
                );


                osc.connect(gain);

                gain.connect(
                    audioCtx.destination
                );


                osc.start(now);

                osc.stop(
                    now + duration + 0.02
                );

            }


            /* BUTTON CLICK SOUND */

            document.addEventListener(
                "click",
                function(e) {

                    const btn =
                        e.target.closest(".btn");

                    if (!btn) {
                        return;
                    }


                    if (
                        btn.classList.contains(
                            "success"
                        )
                    ) {

                        blip("success");

                    } else if (
                        btn.classList.contains(
                            "danger"
                        )
                    ) {

                        blip("error");

                    } else {

                        blip("click");

                    }

                }
            );


            /* HOVER SOUND */

            const hoverTargets =
                ".btn, .avatar-container, .status-pill";


            document.addEventListener(
                "mouseover",
                function(e) {

                    const el =
                        e.target.closest(
                            hoverTargets
                        );

                    if (
                        !el ||
                        el.dataset.soundHovering
                    ) {
                        return;
                    }


                    el.dataset.soundHovering =
                        "1";

                    blip("hover");

                }
            );


            document.addEventListener(
                "mouseout",
                function(e) {

                    const el =
                        e.target.closest(
                            hoverTargets
                        );

                    if (el) {

                        delete
                            el.dataset.soundHovering;

                    }

                }
            );


            /* SUCCESS / ERROR VIEW SOUND */

            const containers =
                document.querySelectorAll(
                    ".view-section"
                );


            if (
                containers.length &&
                "MutationObserver" in window
            ) {

                const seen =
                    new WeakSet();


                const observer =
                    new MutationObserver(
                        function(mutations) {

                            mutations.forEach(
                                function(mutation) {

                                    const el =
                                        mutation.target;


                                    if (
                                        el.classList.contains(
                                            "active"
                                        ) &&
                                        !seen.has(el)
                                    ) {

                                        seen.add(el);


                                        if (
                                            el.querySelector(
                                                ".icon-wrapper.success"
                                            )
                                        ) {

                                            blip(
                                                "success"
                                            );

                                        } else if (
                                            el.querySelector(
                                                ".icon-wrapper.error"
                                            )
                                        ) {

                                            blip(
                                                "error"
                                            );

                                        }

                                    }

                                }
                            );

                        }
                    );


                containers.forEach(
                    function(el) {

                        observer.observe(
                            el,
                            {
                                attributes: true,
                                attributeFilter: [
                                    "class"
                                ]
                            }
                        );

                    }
                );

            }

        })();
    </script>

</body>
</html>
