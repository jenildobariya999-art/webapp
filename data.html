<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verification Console</title>
<style>
  :root {
    --bg: #0B0D12;
    --panel: #12151C;
    --border: #232733;
    --text: #E4E7EC;
    --muted: #7C8494;
    --accent: #5EEAD4;
    --red: #F26D6D;
    --amber: #F5B754;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  header .count { color: var(--muted); font-size: 13px; }
  header input[type=password] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
    width: 180px;
  }
  header button {
    background: var(--accent);
    color: #062521;
    border: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  header button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .layout { display: flex; min-height: calc(100vh - 57px); }
  aside {
    width: 220px;
    border-right: 1px solid var(--border);
    padding: 14px 0;
    flex-shrink: 0;
  }
  aside .bot-item {
    padding: 9px 20px;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    font-size: 13px;
  }
  aside .bot-item:hover { background: var(--panel); }
  aside .bot-item.active { color: var(--text); background: var(--panel); border-left: 2px solid var(--accent); }
  main { flex: 1; padding: 18px 20px; overflow-x: auto; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
  .toolbar input[type=search] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    width: 260px;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    font-size: 12px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    white-space: nowrap;
  }
  td.wrap { white-space: normal; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .pill.success { background: rgba(94,234,212,.15); color: var(--accent); }
  .pill.attempt { background: rgba(245,183,84,.15); color: var(--amber); }
  .pill.failed { background: rgba(242,109,109,.15); color: var(--red); }
  .del { color: var(--muted); cursor: pointer; background: none; border: none; font-size: 13px; }
  .del:hover { color: var(--red); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .gate {
    display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 14px;
  }
  .gate input { width: 240px; }
</style>
</head>
<body>

<div id="gate" class="gate" style="display:none">
  <div style="color:var(--muted)">Enter admin key to continue</div>
  <input type="password" id="gateKey" placeholder="Admin key">
  <button onclick="saveKeyAndLoad()">Unlock</button>
</div>

<div id="app" style="display:none">
  <header>
    <h1>Verification Console</h1>
    <span class="count" id="totalCount"></span>
    <div style="flex:1"></div>
    <button class="ghost" onclick="logout()">Change key</button>
    <button onclick="loadRecords()">Refresh</button>
  </header>
  <div class="layout">
    <aside id="botList"></aside>
    <main>
      <div class="toolbar">
        <input type="search" id="searchBox" placeholder="Search user id / device id..." oninput="render()">
        <div style="flex:1"></div>
        <button class="ghost" id="deleteAllBtn" onclick="deleteAllForBot()">Clear this bot's data</button>
      </div>
      <div id="tableWrap"></div>
    </main>
  </div>
</div>

<script>
  let ADMIN_KEY = localStorage.getItem('verif_admin_key') || '';
  let records = [];
  let activeBot = 'all';

  function saveKeyAndLoad() {
    ADMIN_KEY = document.getElementById('gateKey').value.trim();
    if (!ADMIN_KEY) return;
    localStorage.setItem('verif_admin_key', ADMIN_KEY);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadRecords();
  }

  function logout() {
    localStorage.removeItem('verif_admin_key');
    ADMIN_KEY = '';
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
  }

  async function loadRecords() {
    try {
      const res = await fetch('api/admin-data?limit=1000', { headers: { 'X-Admin-Key': ADMIN_KEY } });
      if (res.status === 401) { logout(); return; }
      const data = await res.json();
      if (!data.ok) { alert('Load failed: ' + data.error); return; }
      records = data.records || [];
      renderBotList();
      render();
    } catch (err) {
      alert('Network error: ' + err.message);
    }
  }

  function renderBotList() {
    const bots = {};
    records.forEach(r => { bots[r.bot_username] = (bots[r.bot_username] || 0) + 1; });
    const aside = document.getElementById('botList');
    let html = `<div class="bot-item ${activeBot === 'all' ? 'active' : ''}" onclick="selectBot('all')">All bots<span>${records.length}</span></div>`;
    Object.keys(bots).sort().forEach(b => {
      html += `<div class="bot-item ${activeBot === b ? 'active' : ''}" onclick="selectBot('${b.replace(/'/g, "\\'")}')">${b}<span>${bots[b]}</span></div>`;
    });
    aside.innerHTML = html;
  }

  function selectBot(bot) {
    activeBot = bot;
    renderBotList();
    render();
  }

  function statusPill(status) {
    const cls = status === 'success' ? 'success' : status === 'attempt' ? 'attempt' : 'failed';
    const label = status === 'success' ? 'Success' : status === 'attempt' ? 'Already' : 'Failed';
    return `<span class="pill ${cls}">${label}</span>`;
  }

  function render() {
    const q = document.getElementById('searchBox').value.toLowerCase();
    document.getElementById('deleteAllBtn').style.display = activeBot === 'all' ? 'none' : 'inline-block';

    let rows = records.filter(r => activeBot === 'all' || r.bot_username === activeBot);
    if (q) rows = rows.filter(r => String(r.user_id).includes(q) || String(r.device_id).toLowerCase().includes(q));

    document.getElementById('totalCount').textContent = rows.length + ' record' + (rows.length === 1 ? '' : 's');

    if (rows.length === 0) {
      document.getElementById('tableWrap').innerHTML = '<div class="empty">No records match.</div>';
      return;
    }

    let html = `<table><thead><tr>
      <th>Status</th><th>Bot</th><th>User ID</th><th>Device ID</th><th>Platform</th><th>IP</th><th>Time</th><th></th>
    </tr></thead><tbody>`;
    rows.forEach(r => {
      html += `<tr>
        <td>${statusPill(r.status)}</td>
        <td>${r.bot_username}</td>
        <td class="mono">${r.user_id}</td>
        <td class="mono wrap">${r.device_id}</td>
        <td>${r.platform || '-'}</td>
        <td class="mono">${r.ip_address || '-'}</td>
        <td class="mono">${new Date(r.created_at).toLocaleString()}</td>
        <td><button class="del" onclick="deleteRow('${r.id}')">Delete</button></td>
      </tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('tableWrap').innerHTML = html;
  }

  async function deleteRow(id) {
    if (!confirm('Delete this record?')) return;
    const res = await fetch('api/admin-data', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': ADMIN_KEY },
      body: JSON.stringify({ ids: [id] })
    });
    const data = await res.json();
    if (!data.ok) { alert('Delete failed: ' + data.error); return; }
    records = records.filter(r => r.id !== id);
    renderBotList();
    render();
  }

  async function deleteAllForBot() {
    if (activeBot === 'all') return;
    if (!confirm(`Delete ALL records for "${activeBot}"? This cannot be undone.`)) return;
    const res = await fetch('api/admin-data', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': ADMIN_KEY },
      body: JSON.stringify({ bot: activeBot })
    });
    const data = await res.json();
    if (!data.ok) { alert('Delete failed: ' + data.error); return; }
    records = records.filter(r => r.bot_username !== activeBot);
    activeBot = 'all';
    renderBotList();
    render();
  }

  // Init
  if (ADMIN_KEY) {
    document.getElementById('app').style.display = 'block';
    loadRecords();
  } else {
    document.getElementById('gate').style.display = 'flex';
  }
</script>
</body>
</html>
