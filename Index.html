<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Payment Bot</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            width: 80%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { margin-top: 0; }
        .price { font-size: 2em; font-weight: bold; color: var(--tg-theme-button-color, #3390ec); }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Premium Access</h1>
        <p>Unlock all features for 24 hours.</p>
        <div class="price">$5.00</div>
        <button id="payBtn">Pay Now</button>
    </div>

    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Make it full screen

        // Handle the Pay Button
        document.getElementById('payBtn').addEventListener('click', function() {
            // 1. Send data to your backend
            // 2. Your backend creates an invoice
            // 3. Your backend tells Telegram to open the payment sheet
            
            // For this demo, we just show a success message
            tg.showPopup({
                title: 'Payment Initiated',
                message: 'Connecting to payment provider...',
                buttons: [{type: 'ok'}]
            });
        });
    </script>
</body>
</html>
