services:
  - type: web
    name: bothub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: DASHBOARD_PASSWORD   # password for the web dashboard
        sync: false
      - key: ADMIN_IDS            # your Telegram user id(s), comma separated
        sync: false
      - key: BOT_TOKEN            # optional: your first bot (more bots can be added in the dashboard)
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: bothub-db
          property: connectionString

databases:
  - name: bothub-db
    plan: free
